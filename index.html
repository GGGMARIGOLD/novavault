<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NovaVault</title>
<style>
:root{--top:#171a21;--bg:#1b2838;--panel:#16202d;--line:#2a475e;--text:#c7d5e0;--bright:#fff;--blue:#66c0f4;--green:#5c7e10;--green2:#a4d007}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#1b2838,#0f1923 600px) fixed;color:var(--text);font:14px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--blue);text-decoration:none}
header{background:var(--top);position:sticky;top:0;z-index:9}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:6px;padding:0 16px;height:56px}
.logo{font:800 24px Georgia,serif;color:var(--bright);margin-right:18px;letter-spacing:.5px;cursor:pointer}
.bar a.t{color:#b8b6b4;padding:8px 12px;font-weight:600;font-size:15px;cursor:pointer}.bar a.t:hover{color:var(--bright)}
.sp{flex:1}.me{color:#b8b6b4;font-size:13px}
input,select,textarea{background:#316282;background:rgba(0,0,0,.35);border:1px solid #000;border-radius:3px;color:var(--bright);padding:8px 10px;font:inherit;width:100%}
button,.btn{border:0;border-radius:2px;padding:8px 16px;font:600 14px inherit;cursor:pointer;color:var(--bright);background:rgba(103,193,245,.2);text-decoration:none;display:inline-block;text-align:center}
button:hover,.btn:hover{background:rgba(103,193,245,.4)}
.buy{background:linear-gradient(90deg,var(--green2),var(--green));color:#d2efa9}.buy:hover{background:linear-gradient(90deg,#b6e60a,#6d9112)}
.pe{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}@media(max-width:800px){.pe{grid-template-columns:1fr}}
.pcard{background:#111a26;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:sticky;top:76px}.pbn{height:110px;cursor:pointer}
.pbody{padding:0 16px 16px}.pav{width:88px;height:88px;border-radius:50%;border:6px solid #111a26;margin-top:-46px;background:#0f1923 center/cover;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;font:700 34px Georgia,serif;color:#fff}
.pav i{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;border:4px solid #111a26}
.pname{font-size:20px;font-weight:700;color:#fff;margin-top:6px}.pstat{color:var(--text);min-height:18px}hr{border:0;border-top:1px solid var(--line);margin:14px 0}.pbio{white-space:pre-wrap;margin-top:4px;word-break:break-word}
#savebar{position:fixed;right:12px;bottom:12px;z-index:16;background:#0b121b;border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 4px 18px #000a}
#dock{position:fixed;left:12px;bottom:12px;z-index:15;background:var(--top);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px #0009;max-width:300px}
#dock .av{width:40px;height:40px;border-radius:50%;background:#0f1923 center/cover;display:flex;align-items:center;justify-content:center;font:700 18px Georgia,serif;color:#fff;cursor:pointer;flex:none}
#dock .nm{color:var(--bright);font-weight:600;cursor:pointer;line-height:1.2}#dock .st{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#dock button{padding:4px 8px;font-size:12px}
main{max-width:1100px;margin:auto;padding:24px 16px 60px}
h1,h2{color:var(--bright);font-weight:400;margin:0 0 12px}h1{font-size:30px}h2{font-size:18px;text-transform:none;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:28px}
.feat{display:grid;grid-template-columns:2fr 1fr;gap:0;background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:20px;cursor:pointer}
.feat .img{aspect-ratio:16/9;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:18px;font:700 34px Georgia,serif;color:#fff;text-shadow:0 2px 10px #000}
.feat .side{padding:20px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,#1e3a52,#16202d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--panel);border-radius:3px;overflow:hidden;cursor:pointer}.card:hover{background:#22364a}
.card .img{aspect-ratio:16/9;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:8px;font:700 18px Georgia,serif;color:#fff;text-shadow:0 2px 8px #000}
.card .b{padding:10px 12px}.card .n{color:var(--bright);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .m{font-size:12px;color:#8f98a0;display:flex;justify-content:space-between;align-items:center}
.pr{background:rgba(0,0,0,.4);padding:2px 8px;border-radius:2px;color:var(--bright);font-size:13px}.pr s{color:#738895;margin-right:6px}.pr b{color:var(--green2);font-weight:600}.dc{background:#4c6b22;color:var(--green2);padding:2px 6px;margin-right:6px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.chip{padding:5px 12px;background:rgba(103,193,245,.1);cursor:pointer;border-radius:2px}.chip.on{background:var(--blue);color:#06121c}
.game{display:grid;grid-template-columns:1fr 320px;gap:24px}@media(max-width:800px){.game,.feat{grid-template-columns:1fr}}
.game .img{aspect-ratio:16/9;background-size:cover;background-position:center;border-radius:3px;display:flex;align-items:flex-end;padding:18px;font:700 40px Georgia,serif;color:#fff;text-shadow:0 2px 10px #000}
.box{background:var(--panel);padding:16px;border-radius:3px}.box+.box{margin-top:14px}
table{width:100%;border-collapse:collapse}td{padding:5px 0;border-bottom:1px solid #22364a}td:first-child{color:#8f98a0;width:38%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:12px 0 4px;color:#8f98a0}
.lib{display:flex;align-items:center;gap:14px;background:var(--panel);padding:10px;margin-bottom:8px;border-radius:3px}.lib .img{width:120px;aspect-ratio:16/9;background-size:cover;background-position:center;border-radius:2px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:4px;z-index:20}
.empty{padding:40px;text-align:center;color:#8f98a0}progress{width:100%;height:10px}
</style></head><body>
<header><div class="bar"><span class="logo" onclick="go('')">NOVAVAULT</span><a class="t" onclick="go('')">Store</a><a class="t" onclick="go('library')">Library</a><a class="t" onclick="go('publish')">Publish</a><a class="t" id="modlink" onclick="go('admin')" hidden></a><span class="sp"></span><span id="acct"></span></div></header>
<main id="app"></main>
<div id="dock"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd=c=>c?"$"+(c/100).toFixed(2):"Free",eff=g=>g.sale>0&&g.sale<g.price?g.sale:g.price;
const pg=()=>games.filter(g=>g.status==="approved");
let me=null,demoFunds=false,games=[],genre="All",q="";
const GR=["#2b5876,#4e4376","#614385,#516395","#134e5e,#71b280","#42275a,#734b6d","#8e2de2,#4a00e0","#cb2d3e,#ef473a"];
const art=g=>g.hasCover?`background-image:linear-gradient(transparent 55%,#000a),url(/cover/${g.id})`:`background:linear-gradient(135deg,${GR[g.id%GR.length]})`;
const sz=b=>b>=1e9?(b/1e9).toFixed(2)+" GB":(b/1e6).toFixed(1)+" MB";
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)}
async function api(p,o={}){const r=await fetch(p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Request failed");return j}
const post=(p,b)=>api(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})});
const go=h=>{location.hash="#/"+h};
function price(g){return g.sale>0&&g.sale<g.price?`<span class="pr"><span class="dc">-${Math.round(100-g.sale/g.price*100)}%</span><s>${usd(g.price)}</s><b>${usd(g.sale)}</b></span>`:`<span class="pr">${usd(g.price)}</span>`}
const card=g=>`<div class="card" onclick="go('game/${g.id}')"><div class="img" style="${art(g)}">${g.hasCover?"":esc(g.title)}</div><div class="b"><div class="n">${esc(g.title)}</div><div class="m"><span>${esc(g.genre||g.platform)}</span>${price(g)}</div></div></div>`;
async function refresh(){const [m,g]=await Promise.all([api("/api/me"),api("/api/games")]);me=m.user;demoFunds=m.demoFunds;games=g;let mp=null;if(me){try{mp=await api("/api/profile/"+encodeURIComponent(me.name))}catch(e){}}
 const pr=mp?PRES[mp.presence]||PRES.online:PRES.online,t=Date.now();
 $("#dock").innerHTML=me?`<div class="av" style="${mp&&mp.hasAvatar?`background-image:url(/avatar/${encodeURIComponent(me.name)}?t=${t})`:""}" onclick="go('profile/${esc(me.name)}')">${mp&&mp.hasAvatar?"":esc(me.name[0].toUpperCase())}</div><div><div class="nm" onclick="go('profile/${esc(me.name)}')">${esc(me.name)}</div><div class="st" style="color:${pr[1]}">● ${pr[0]}${mp&&mp.statusText?" · "+esc(mp.statusText):""}</div></div><button onclick="go('settings')">Edit</button>`:`<div class="nm" onclick="go('login')">Log in to see your profile</div>`;
 const ml=$("#modlink");ml.hidden=!(me&&["mod","admin"].includes(me.role));ml.textContent=me&&me.role==="admin"?"Admin":"Moderation";
 $("#acct").innerHTML=me?`<span class="me">Wallet ${usd(me.balance)}</span> <button onclick="addFunds()" ${demoFunds?"":"hidden"}>+ Add test funds</button> <button onclick="logout()">Log out</button>`:`<button onclick="go('login')">Log in</button>`}
async function addFunds(){try{await post("/api/wallet/add");toast("Added $20 test funds");route()}catch(e){toast(e.message)}}
async function logout(){await post("/api/logout");go("");route()}
async function route(){await refresh();const p=location.hash.replace(/^#\//,"").split("/"),v=p[0];
 if(v==="game")return gamePage(+p[1]);if(v==="library")return libPage();if(v==="publish")return pubPage();if(v==="admin")return adminPage();if(v==="profile")return profilePage(decodeURIComponent(p[1]||""));if(v==="settings")return settingsPage();if(v==="login")return authPage();storePage()}
function storePage(){const gs=[...new Set(pg().map(g=>g.genre).filter(Boolean))],list=pg().filter(g=>(genre==="All"||g.genre===genre)&&(g.title+g.dev).toLowerCase().includes(q.toLowerCase())),f=pg()[0];
 $("#app").innerHTML=(f&&!q&&genre==="All"?`<div class="feat" onclick="go('game/${f.id}')"><div class="img" style="${art(f)}">${f.hasCover?"":esc(f.title)}</div><div class="side"><h1>${esc(f.title)}</h1><div>${esc((f.desc||"").slice(0,160))}</div><div>${price(f)}</div><span class="btn buy">View game</span></div></div>`:"")+
 `<input id="s" placeholder="Search games or developers" value="${esc(q)}"><div class="chips">${["All",...gs].map(x=>`<span class="chip ${x===genre?"on":""}" onclick="genre='${esc(x)}';storePage()">${esc(x)}</span>`).join("")}</div>`+
 (list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">${pg().length?"No games match your search.":"The store is empty. Publish the first game."}</div>`);
 const s=$("#s");s.oninput=()=>{q=s.value;const c=s.selectionStart;storePage();$("#s").focus();$("#s").setSelectionRange(c,c)}}
function gamePage(id){const g=games.find(x=>x.id===id);if(!g)return $("#app").innerHTML='<div class="empty">Game not found.</div>';
 const own=me&&(me.library.includes(id)||g.owner===me.name.toLowerCase()||["mod","admin"].includes(me.role)),r=[["Platform",g.platform],["Version",g.version],["Download size",sz(g.size)],["OS",g.os],["RAM",g.ram],["Storage",g.storage]];
 $("#app").innerHTML=`<h1>${esc(g.title)}</h1>${g.status==="pending"?'<div class="box" style="margin-bottom:14px;color:#ffd479">Waiting for moderator approval. Only you and moderators can see this game.</div>':g.status==="rejected"?`<div class="box" style="margin-bottom:14px;color:#ff8a8a">Rejected by a moderator${g.reason?": "+esc(g.reason):"."}</div>`:""}<div class="game"><div><div class="img" style="${art(g)}">${g.hasCover?"":esc(g.title)}</div><div class="box" style="margin-top:14px"><p style="white-space:pre-wrap;margin:0">${esc(g.desc)||"No description."}</p></div></div>
 <div><div class="box"><div style="margin-bottom:12px">${price(g)}</div>${own?`<a class="btn buy" style="width:100%" href="/download/${id}">Download ${esc(g.filename||"")}</a>`:g.status!=="approved"?"":`<button class="btn buy" style="width:100%" id="b">${eff(g)?"Buy for "+usd(eff(g)):"Add to library"}</button>`}
 ${me&&g.owner===me.name.toLowerCase()?`<button style="width:100%;margin-top:8px" id="d">Remove my game</button>`:""}</div>
 <div class="box"><b style="color:#fff">System requirements</b><table>${r.map(([k,v])=>`<tr><td>${k}</td><td>${esc(v)||"—"}</td></tr>`).join("")}</table><p style="margin:10px 0 0;color:#8f98a0">Developer: <a style="cursor:pointer" onclick="go('profile/${esc(g.owner)}')">${esc(g.dev)}</a></p></div></div></div>`;
 const b=$("#b");if(b)b.onclick=async()=>{if(!me)return go("login");try{await post(`/api/games/${id}/buy`);toast("Added to your library");route()}catch(e){toast(e.message)}};
 const d=$("#d");if(d)d.onclick=async()=>{if(confirm("Remove this game permanently?")){await api("/api/games/"+id,{method:"DELETE"});go("");}}}
function libPage(){if(!me)return go("login");const l=games.filter(g=>me.library.includes(g.id));
 $("#app").innerHTML=`<h1>Library</h1>`+(l.length?l.map(g=>`<div class="lib"><div class="img" style="${art(g)}"></div><div style="flex:1"><div style="color:#fff;font-size:16px">${esc(g.title)}</div><div style="color:#8f98a0">${esc(g.platform)} · ${esc(g.version)} · ${sz(g.size)}</div></div><a class="btn buy" href="/download/${g.id}">Download</a></div>`).join(""):'<div class="empty">Your library is empty. Browse the store to add games.</div>')+subs()}
function subs(){const m=games.filter(g=>me&&g.owner===me.name.toLowerCase());return m.length?`<h2>My submissions</h2>`+m.map(g=>`<div class="lib"><div class="img" style="${art(g)}"></div><div style="flex:1"><div style="color:#fff">${esc(g.title)}</div><div style="color:#8f98a0">${g.status==="approved"?"Live in the store":g.status==="pending"?"Waiting for moderator approval":"Rejected"+(g.reason?": "+esc(g.reason):"")}</div></div><a class="btn" onclick="go('game/${g.id}')">View</a></div>`).join(""):""}
function authPage(){$("#app").innerHTML=`<div class="box" style="max-width:380px;margin:30px auto"><h1>Sign in</h1><label>Username</label><input id="u" autocomplete="username"><label>Password (8+ characters)</label><input id="p" type="password" autocomplete="current-password"><div class="row" style="margin-top:16px"><button class="buy" id="li">Log in</button><button id="rg">Create account</button></div></div>`;
 const run=async(path)=>{try{await post(path,{username:$("#u").value,password:$("#p").value});if(path==="/api/register")await post("/api/login",{username:$("#u").value,password:$("#p").value});go("");}catch(e){toast(e.message)}};$("#li").onclick=()=>run("/api/login");$("#rg").onclick=()=>run("/api/register")}
function pubPage(){if(!me)return go("login");const F=(id,l,x="")=>`<div><label>${l}</label><input id="${id}" ${x}></div>`;
 $("#app").innerHTML=`<h1>Publish a game</h1><div class="box"><label>Game or APK file</label><input type="file" id="file"><div class="row">${F("title","Title")}${F("genre","Genre","placeholder='Action, Puzzle…'")}</div><label>Description</label><textarea id="desc" rows="4"></textarea>
 <div class="row">${F("price","Price (USD, 0 = free)",'type="number" min="0" step="0.01" value="0"')}${F("sale","Sale price (optional)",'type="number" min="0" step="0.01"')}</div>
 <div class="row"><div><label>Platform</label><select id="platform"><option>Android</option><option>Windows</option><option>macOS</option><option>Linux</option></select></div>${F("version","Version","placeholder='1.0.0'")}</div>
 <div class="row">${F("os","Minimum OS","placeholder='Android 8.0+'")}${F("ram","RAM","placeholder='3 GB'")}</div>${F("storage","Storage required","placeholder='200 MB'")}<label>Cover image (PNG, JPG, WebP)</label><input type="file" id="cover" accept="image/png,image/jpeg,image/webp">
 <p style="margin-top:16px;color:#8f98a0">New games are reviewed by a moderator before they appear in the store.</p><p><button class="buy" id="go">Upload and submit</button></p><progress id="pg" value="0" max="1" hidden></progress><div id="msg" style="color:#ff8a8a;margin-top:10px"></div></div>`;
 $("#go").onclick=()=>{const f=$("#file").files[0];if(!f||!$("#title").value.trim())return toast("Choose a file and enter a title");const fd=new FormData();
  ["title","genre","desc","price","sale","platform","version","os","ram","storage"].forEach(k=>fd.append(k,$("#"+k).value));fd.append("file",f);if($("#cover").files[0])fd.append("cover",$("#cover").files[0]);
  const x=new XMLHttpRequest();x.open("POST","/api/games");$("#pg").hidden=false;x.upload.onprogress=e=>{$("#pg").value=e.loaded/e.total};
  const err=m=>{$("#msg").textContent=m;$("#pg").hidden=true};$("#msg").textContent="";
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}if(x.status===200){const u=me.role==="user";toast(u?"Submitted for moderator review":"Published");go(u?"library":"game/"+j.id)}else err(j.error||"Upload failed (server answered "+x.status+")")};
  x.onerror=()=>err("The connection dropped during upload. The file may be too large for this host, or the server stopped.");x.send(fd)}}
async function adminPage(){if(!me||!["mod","admin"].includes(me.role))return go("");const q=games.filter(g=>g.status==="pending");let users=[];if(me.role==="admin")users=await api("/api/admin/users");
 $("#app").innerHTML=`<h1>Moderation</h1><h2>Games waiting for review (${q.length})</h2>`+(q.length?q.map(g=>`<div class="lib"><div class="img" style="${art(g)}"></div><div style="flex:1"><div style="color:#fff;font-size:16px">${esc(g.title)} <span style="color:#8f98a0">by ${esc(g.dev)}</span></div><div style="color:#8f98a0">${esc(g.platform)} · ${esc(g.version)} · ${sz(g.size)} · ${usd(g.price)}</div><div>${esc((g.desc||"").slice(0,200))}</div></div><a class="btn" href="/download/${g.id}">Download to check</a><button class="buy" onclick="decide(${g.id},'approve')">Approve</button><button onclick="decide(${g.id},'reject')">Reject</button></div>`).join(""):'<div class="empty">Nothing to review.</div>')+
 (me.role==="admin"?`<h2>Users</h2><div class="box"><table>${users.map(u=>`<tr><td style="width:auto">${esc(u.name)}<br><span style="color:#8f98a0">${esc(u.role)} · ${usd(u.balance)}</span></td><td><input id="c-${esc(u.name)}" type="number" step="0.01" placeholder="USD" style="width:100px"></td><td><button onclick="credit('${esc(u.name)}')">Add credits</button></td><td><select id="bg-${esc(u.name)}" style="width:120px"><option>Founder</option><option>Beta Tester</option><option>Verified Dev</option><option>Supporter</option></select> <button onclick="badge('${esc(u.name)}',true)">Give</button><button onclick="badge('${esc(u.name)}',false)">Take</button></td><td>${u.role==="admin"?"":`<button onclick="setRole('${esc(u.name)}','${u.role==="mod"?"user":"mod"}')">${u.role==="mod"?"Remove moderator":"Make moderator"}</button>`}</td></tr>`).join("")}</table></div>`:"")}
async function decide(id,a){let b={};if(a==="reject"){const r=prompt("Reason for rejecting (the developer will see this):");if(r===null)return;b={reason:r}}try{await post(`/api/mod/games/${id}/${a}`,b);toast(a==="approve"?"Approved":"Rejected");route()}catch(e){toast(e.message)}}
async function credit(n){const v=parseFloat($("#c-"+n).value);if(!v)return toast("Enter an amount in USD");try{await post("/api/admin/credits",{username:n,amount:v});toast("Credits updated");route()}catch(e){toast(e.message)}}
async function badge(n,g){try{await post("/api/admin/badge",{username:n,badge:$("#bg-"+n).value,grant:g});toast(g?"Badge given":"Badge removed")}catch(e){toast(e.message)}}
const PRES={online:["Online","#57cbde"],away:["Away","#e0b44c"],busy:["Busy","#e05252"],offline:["Offline","#8f98a0"],invisible:["Invisible","#8f98a0"]};
const BC={Admin:"#c0392b",Moderator:"#2e86c1",Developer:"#27ae60",Collector:"#8e44ad",Founder:"#d4a017","Beta Tester":"#16a085","Verified Dev":"#2980b9",Supporter:"#d35498"};
const badgeHtml=b=>`<span class="chip" style="background:${BC[b]||"#555"};color:#fff;cursor:default">${esc(b)}</span>`;
async function profilePage(name){let p;try{p=await api("/api/profile/"+encodeURIComponent(name))}catch(e){return $("#app").innerHTML='<div class="empty">Profile not found.</div>'}
 const mine=me&&me.name.toLowerCase()===p.key,t=Date.now(),pr=PRES[p.presence]||PRES.online;
 $("#app").innerHTML=`<div class="box" style="padding:0;overflow:hidden"><div style="height:200px;background:${p.hasBanner?`url(/banner/${p.key}?t=${t}) center/cover`:"linear-gradient(135deg,#2b5876,#4e4376)"}"></div>
 <div style="display:flex;gap:18px;padding:0 20px 20px;margin-top:-46px;flex-wrap:wrap;align-items:flex-end"><div style="width:128px;height:128px;border-radius:50%;border:4px solid var(--panel);background:#0f1923 ${p.hasAvatar?`url(/avatar/${p.key}?t=${t}) center/cover`:""};display:flex;align-items:center;justify-content:center;font:700 52px Georgia,serif;color:#fff">${p.hasAvatar?"":esc(p.name[0].toUpperCase())}</div>
 <div style="flex:1;min-width:200px"><h1 style="margin:0">${esc(p.name)}</h1><div style="color:${pr[1]}">● ${pr[0]}${p.statusText?` <span style="color:var(--text)">· ${esc(p.statusText)}</span>`:""}</div></div>${mine?`<button onclick="go('settings')">Edit profile</button>`:""}</div></div>
 <div class="game" style="margin-top:16px"><div><div class="box"><b style="color:#fff">About</b><p style="white-space:pre-wrap;margin:8px 0 0">${esc(p.bio)||"This user hasn't written a bio yet."}</p></div>${p.games.length?`<h2>Games by ${esc(p.name)}</h2><div class="grid">${p.games.map(card).join("")}</div>`:""}</div>
 <div class="box"><b style="color:#fff">Badges</b><div class="chips">${p.badges.length?p.badges.map(badgeHtml).join(""):'<span style="color:#8f98a0">No badges yet</span>'}</div><div style="color:#8f98a0">Games owned: ${p.owned}${p.joined?" · Joined "+new Date(p.joined*1000).toLocaleDateString():""}</div></div></div>`}
async function settingsPage(){if(!me)return go("login");const p=await api("/api/profile/"+encodeURIComponent(me.name)),t=Date.now(),IMG="image/png,image/jpeg,image/webp",raw={online:"Online",away:"Away",busy:"Busy",invisible:"Invisible"},
 S={av:null,bn:null,rav:false,rbn:false,avUrl:p.hasAvatar?`/avatar/${p.key}?t=${t}`:"",bnUrl:p.hasBanner?`/banner/${p.key}?t=${t}`:""};
 $("#app").innerHTML=`<h1>My profile</h1><div class="pe"><div>
 <h2 style="margin-top:0">Avatar</h2><button class="buy" id="avb">Change avatar</button> <button id="avr">Remove avatar</button>
 <h2>Banner</h2><button class="buy" id="bnb">Change banner</button> <button id="bnr">Remove banner</button>
 <h2>Status</h2><select id="pr">${Object.entries(raw).map(([k,v])=>`<option value="${k}" ${k===p.presence?"selected":""}>${v}</option>`).join("")}</select>
 <input id="st" maxlength="80" value="${esc(p.statusText)}" placeholder="What are you up to?" style="margin-top:8px">
 <h2>About me</h2><textarea id="bio" rows="5" maxlength="500" placeholder="Tell people about yourself">${esc(p.bio)}</textarea><div id="cnt" style="color:#8f98a0;font-size:12px;text-align:right"></div>
 <h2>Badges (show up to 3)</h2>${p.earned.length?p.earned.map(b=>`<label style="display:inline-flex;gap:6px;margin-right:16px"><input type="checkbox" class="bd" value="${esc(b)}" style="width:auto" ${p.shown.includes(b)?"checked":""}> ${esc(b)}</label>`).join(""):'<div style="color:#8f98a0">No badges yet. Publish an approved game or own 10 games.</div>'}
 <input type="file" id="avin" accept="${IMG}" hidden><input type="file" id="bnin" accept="${IMG}" hidden></div>
 <div><div class="pcard"><div id="pbn" class="pbn" title="Change banner"></div><div class="pbody"><div id="pav" class="pav" title="Change avatar"><span id="pin"></span><i id="pdot"></i></div>
 <div class="pname">${esc(p.name)}</div><div id="pst" class="pstat"></div><div id="pbd" class="chips" style="margin:10px 0 0"></div><hr><b style="font-size:13px;color:#fff">About me</b><div id="pbio" class="pbio"></div></div></div></div></div>
 <div id="savebar" hidden><span>You have unsaved changes.</span><button id="rs">Reset</button><button class="buy" id="sv">Save changes</button><span id="msg" style="color:#ff8a8a"></span></div>`;
 const bar=$("#savebar"),msg=m=>{$("#msg").textContent=m;bar.hidden=false};
 const pv=()=>{$("#pbn").style.background=S.bnUrl?`url(${S.bnUrl}) center/cover`:"linear-gradient(135deg,#2b5876,#4e4376)";$("#pav").style.backgroundImage=S.avUrl?`url(${S.avUrl})`:"none";$("#pin").textContent=S.avUrl?"":p.name[0].toUpperCase();
  $("#pdot").style.background=(PRES[$("#pr").value]||PRES.online)[1];$("#pst").textContent=$("#st").value;$("#pbio").textContent=$("#bio").value||"Nothing here yet.";$("#cnt").textContent=$("#bio").value.length+"/500";
  $("#pbd").innerHTML=[...document.querySelectorAll(".bd:checked")].map(x=>badgeHtml(x.value)).join("")};
 const dirty=()=>{bar.hidden=false;$("#msg").textContent="";pv()};
 const pick=(inp,key,rk,uk,lim,name)=>{$(inp).onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>lim*1048576)return msg(name+" must be under "+lim+" MB");S[key]=f;S[rk]=false;S[uk]=URL.createObjectURL(f);dirty()}};
 pick("#avin","av","rav","avUrl",2,"Avatar");pick("#bnin","bn","rbn","bnUrl",5,"Banner");
 $("#avb").onclick=$("#pav").onclick=()=>$("#avin").click();$("#bnb").onclick=$("#pbn").onclick=()=>$("#bnin").click();
 $("#avr").onclick=()=>{S.av=null;S.rav=true;S.avUrl="";dirty()};$("#bnr").onclick=()=>{S.bn=null;S.rbn=true;S.bnUrl="";dirty()};
 ["#pr","#st","#bio"].forEach(s=>$(s).oninput=dirty);document.querySelectorAll(".bd").forEach(c=>c.onchange=()=>{if(document.querySelectorAll(".bd:checked").length>3){c.checked=false;msg("Choose at most 3 badges.")}else dirty()});
 $("#rs").onclick=()=>settingsPage();pv();
 $("#sv").onclick=async()=>{const fd=new FormData();fd.append("presence",$("#pr").value);fd.append("statusText",$("#st").value);fd.append("bio",$("#bio").value);fd.append("shown",[...document.querySelectorAll(".bd:checked")].map(x=>x.value).join("|"));
  fd.append("removeAvatar",S.rav?"1":"0");fd.append("removeBanner",S.rbn?"1":"0");if(S.av)fd.append("avatar",S.av);if(S.bn)fd.append("banner",S.bn);
  $("#sv").disabled=true;try{await api("/api/profile",{method:"POST",body:fd});toast("Profile saved");go("profile/"+me.name)}catch(e){msg(e.message)}$("#sv").disabled=false}}
async function setRole(n,r){try{await post("/api/admin/role",{username:n,role:r});route()}catch(e){toast(e.message)}}
addEventListener("hashchange",route);route();
</script></body></html>

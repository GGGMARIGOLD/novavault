<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vespera</title>
<style>
:root{--top:#171a21;--bg:#1b2838;--panel:#16202d;--line:#2a475e;--text:#c7d5e0;--bright:#fff;--blue:#66c0f4;--green:#5c7e10;--green2:#a4d007}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#1b2838,#0f1923 600px) fixed;color:var(--text);font:14px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--blue);text-decoration:none}
header{background:var(--top);position:sticky;top:0;z-index:9}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:6px;padding:0 16px;height:56px}
.logo{font:800 23px Georgia,serif;margin-right:18px;letter-spacing:4px;cursor:pointer;background:linear-gradient(90deg,#ffd27d,#ff8fb1 45%,#a98bff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}.logo .star{margin-right:6px;-webkit-text-fill-color:#ffd27d}
.bar a.t{color:#b8b6b4;padding:8px 12px;font-weight:600;font-size:15px;cursor:pointer}.bar a.t:hover{color:var(--bright)}
.sp{flex:1}.me{color:#b8b6b4;font-size:13px}
input,select,textarea{background:#316282;background:rgba(0,0,0,.35);border:1px solid #000;border-radius:3px;color:var(--bright);padding:8px 10px;font:inherit;width:100%}
button,.btn{border:0;border-radius:2px;padding:8px 16px;font:600 14px inherit;cursor:pointer;color:var(--bright);background:rgba(103,193,245,.2);text-decoration:none;display:inline-block;text-align:center}
button:hover,.btn:hover{background:rgba(103,193,245,.4)}
.buy{background:linear-gradient(90deg,var(--green2),var(--green));color:#d2efa9}.buy:hover{background:linear-gradient(90deg,#b6e60a,#6d9112)}
.pe{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}@media(max-width:800px){.pe{grid-template-columns:1fr}}
.pcard{background:#111a26;border:1px solid var(--line);border-radius:10px;overflow:hidden;position:sticky;top:76px}.pbn{height:110px;cursor:pointer}
.pbody{padding:0 16px 16px}.pav{width:88px;height:88px;border-radius:50%;border:6px solid #111a26;margin-top:-46px;background:#0f1923 center/cover;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;font:700 34px Georgia,serif;color:#fff}
.pav i{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;border:4px solid #111a26}
.pname{font-size:20px;font-weight:700;color:#fff;margin-top:6px}.pstat{color:var(--text);min-height:18px}hr{border:0;border-top:1px solid var(--line);margin:14px 0}.pbio{white-space:pre-wrap;margin-top:4px;word-break:break-word}
#savebar{position:fixed;right:12px;bottom:12px;z-index:16;background:#0b121b;border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 4px 18px #000a}
#dock{position:fixed;left:12px;bottom:12px;z-index:15;background:var(--top);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px #0009;max-width:300px}
#dock{isolation:isolate}#dock .av{width:40px;height:40px;border-radius:50%;background:#0f1923 center/cover;display:flex;align-items:center;justify-content:center;font:700 18px Georgia,serif;color:#fff;cursor:pointer;flex:none}
#dock .nm{color:var(--bright);font-weight:600;cursor:pointer;line-height:1.2}#dock .st{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#dock button{padding:4px 8px;font-size:12px}
main{max-width:1100px;margin:auto;padding:24px 16px 60px}
h1,h2{color:var(--bright);font-weight:400;margin:0 0 12px}h1{font-size:30px}h2{font-size:18px;text-transform:none;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:28px}
.feat{display:grid;grid-template-columns:2fr 1fr;gap:0;background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:20px;cursor:pointer}
.feat .img{aspect-ratio:16/9;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:18px;font:700 34px Georgia,serif;color:#fff;text-shadow:0 2px 10px #000}
.feat .side{padding:20px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(135deg,#1e3a52,#16202d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--panel);border-radius:3px;overflow:hidden;cursor:pointer}.card:hover{background:#22364a}
.card .img{aspect-ratio:16/9;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:8px;font:700 18px Georgia,serif;color:#fff;text-shadow:0 2px 8px #000}
.card .b{padding:10px 12px}.card .n{color:var(--bright);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .m{font-size:12px;color:#8f98a0;display:flex;justify-content:space-between;align-items:center}
.pr{background:rgba(0,0,0,.4);padding:2px 8px;border-radius:2px;color:var(--bright);font-size:13px}.pr s{color:#738895;margin-right:6px}.pr b{color:var(--green2);font-weight:600}.dc{background:#4c6b22;color:var(--green2);padding:2px 6px;margin-right:6px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.chip{padding:5px 12px;background:rgba(103,193,245,.1);cursor:pointer;border-radius:2px}.chip.on{background:var(--blue);color:#06121c}
.game{display:grid;grid-template-columns:1fr 320px;gap:24px}@media(max-width:800px){.game,.feat{grid-template-columns:1fr}}
.game .img{aspect-ratio:16/9;background-size:cover;background-position:center;border-radius:3px;display:flex;align-items:flex-end;padding:18px;font:700 40px Georgia,serif;color:#fff;text-shadow:0 2px 10px #000}
.box{background:var(--panel);padding:16px;border-radius:3px}.box+.box{margin-top:14px}
table{width:100%;border-collapse:collapse}td{padding:5px 0;border-bottom:1px solid #22364a}td:first-child{color:#8f98a0;width:38%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:12px 0 4px;color:#8f98a0}
.lib{display:flex;align-items:center;gap:14px;background:var(--panel);padding:10px;margin-bottom:8px;border-radius:3px}.lib .img{width:120px;aspect-ratio:16/9;background-size:cover;background-position:center;border-radius:2px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:4px;z-index:20}
.empty{padding:40px;text-align:center;color:#8f98a0}progress{width:100%;height:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{padding:9px 14px;cursor:pointer;color:#8f98a0;border-bottom:2px solid transparent;font-weight:600}.tab:hover{color:#fff}.tab.on{color:#fff;border-color:var(--blue)}
.tab .n{background:#c0392b;color:#fff;border-radius:9px;padding:0 7px;font-size:12px;margin-left:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}.stat{background:var(--panel);border-radius:4px;padding:14px 16px}.stat b{display:block;font-size:26px;color:#fff;font-weight:600}.stat span{color:#8f98a0;font-size:13px}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px;font-weight:600;background:#2a3f55;color:#c7d5e0}.pill.ok{background:#2d4a1a;color:#a4d007}.pill.wait{background:#4d3d12;color:#ffd479}.pill.bad{background:#4d1d1d;color:#ff8a8a}.pill.off{background:#333;color:#aaa}.pill.exe{background:#3a2552;color:#d6b4ff}
.rv{background:var(--panel);border-radius:4px;display:grid;grid-template-columns:260px 1fr;gap:18px;padding:16px;margin-bottom:14px}@media(max-width:800px){.rv{grid-template-columns:1fr}}
.rv .img{aspect-ratio:16/9;border-radius:3px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:8px;font:700 18px Georgia,serif;color:#fff}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;margin:10px 0;font-size:13px}.kv div span{color:#8f98a0;display:block;font-size:12px}
.warn{background:#3d2a12;border-left:3px solid #e0b44c;padding:8px 12px;margin:10px 0;color:#ffd479;font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.acts select,.acts input{width:auto}
.ut{width:100%;border-collapse:collapse}.ut td,.ut th{padding:9px 8px;border-bottom:1px solid #22364a;vertical-align:middle;text-align:left}.ut th{color:#8f98a0;font-weight:400;font-size:12px}.ut td:first-child{width:auto;color:inherit}
.mini{width:34px;height:34px;border-radius:50%;background:#0f1923 center/cover;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;vertical-align:middle;margin-right:8px}
.thumb{width:72px;aspect-ratio:16/9;border-radius:2px;background-size:cover;background-position:center;display:inline-block;vertical-align:middle;margin-right:10px}
#announce{background:linear-gradient(90deg,#1e4d72,#3a2f6b);color:#fff;text-align:center;padding:8px 16px;font-weight:600}
.drop{border:2px dashed var(--line);border-radius:4px;padding:22px;text-align:center;cursor:pointer;color:#8f98a0}.drop:hover,.drop.on{border-color:var(--blue);color:#fff}
.bar2{height:10px;background:#0f1923;border-radius:5px;overflow:hidden;margin-top:10px}.bar2 i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green2),var(--green));transition:width .2s}
.fx{position:relative}.fxb{position:relative;overflow:hidden}
.frame_gold{box-shadow:0 0 0 3px #e6c45a,0 0 0 6px #7a5b12,0 0 16px #e6c45a99}
.frame_neon{box-shadow:0 0 0 3px #3ff4ff,0 0 18px 5px #3ff4ffaa;animation:neon 1.6s ease-in-out infinite alternate}
@keyframes neon{to{box-shadow:0 0 0 3px #ff4fd8,0 0 22px 7px #ff4fd8aa}}
.frame_ember{box-shadow:0 0 0 3px #ff8a1f,0 0 20px 6px #ff3d00aa;animation:ember 1.1s ease-in-out infinite alternate}
@keyframes ember{to{box-shadow:0 0 0 3px #ffcf3f,0 0 26px 9px #ff6a00cc}}
.frame_frost{box-shadow:0 0 0 3px #d9f4ff,0 0 0 6px #4f9fd1,0 0 18px #9fe0ffbb}
.frame_aurora::before,.frame_void::before{content:"";position:absolute;inset:-7px;border-radius:50%;z-index:-1;animation:spin 3.5s linear infinite}
.frame_aurora::before{background:conic-gradient(#3fffa8,#3fb4ff,#a46bff,#ff6bd5,#ffd36b,#3fffa8)}
.frame_void::before{background:conic-gradient(#0b0014,#7b2cff,#0b0014,#ff2c9c,#0b0014);filter:drop-shadow(0 0 8px #7b2cff)}
@keyframes spin{to{transform:rotate(360deg)}}
.theme_dusk{background:linear-gradient(160deg,#2a1b3d,#5b3a8c 55%,#e98074)!important}
.theme_ocean{background:linear-gradient(160deg,#03213a,#0b4f6c 55%,#20a4c3)!important}
.theme_forest{background:linear-gradient(160deg,#0f2417,#24502f 55%,#6b8f3a)!important}
.theme_rose{background:linear-gradient(160deg,#3a1a2a,#8a3a62 55%,#f2a7c3)!important}
.theme_crimson{background:linear-gradient(160deg,#16070a,#5a0f1c 55%,#b3122e)!important}
.theme_nebula{background:linear-gradient(120deg,#120326,#3b0f6e,#0d3b66,#6e0f5a,#120326)!important;background-size:400% 400%!important;animation:nebula 14s ease infinite}
@keyframes nebula{50%{background-position:100% 50%}}
.name_gold,.name_ice,.name_fire,.name_prism{-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important;-webkit-text-fill-color:transparent}
.name_gold{background:linear-gradient(90deg,#fff1a8,#e6c45a,#b8860b,#fff1a8)}.name_ice{background:linear-gradient(90deg,#ffffff,#9fe0ff,#4f9fd1)}
.name_fire{background:linear-gradient(90deg,#ffd23f,#ff7a18,#ff2e2e,#ffd23f);background-size:200% auto;animation:flow 2.5s linear infinite}
.name_prism{background:linear-gradient(90deg,#ff5f6d,#ffc371,#47e891,#3fb4ff,#a46bff,#ff5f6d);background-size:300% auto;animation:flow 4s linear infinite}
@keyframes flow{to{background-position:200% center}}
.effect_stars::after,.effect_snow::after,.effect_embers::after{content:"";position:absolute;inset:0;pointer-events:none}
.effect_stars::after{background-image:radial-gradient(2px 2px at 12% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 70%,#fff,transparent),radial-gradient(2px 2px at 55% 20%,#ffe9a8,transparent),radial-gradient(1.5px 1.5px at 72% 60%,#fff,transparent),radial-gradient(2.5px 2.5px at 88% 35%,#fff,transparent),radial-gradient(1.5px 1.5px at 42% 45%,#cfe3ff,transparent);animation:twinkle 2.4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
.effect_snow::after{background-image:radial-gradient(3px 3px at 10% 10%,#fff,transparent),radial-gradient(2px 2px at 30% 40%,#fff,transparent),radial-gradient(3px 3px at 50% 20%,#fff,transparent),radial-gradient(2px 2px at 70% 50%,#fff,transparent),radial-gradient(3px 3px at 90% 30%,#fff,transparent);background-size:200px 120px;animation:snow 6s linear infinite}
@keyframes snow{to{background-position:30px 120px,-20px 120px,10px 120px,-30px 120px,20px 120px}}
.effect_embers::after{background-image:radial-gradient(3px 3px at 15% 90%,#ffb347,transparent),radial-gradient(2px 2px at 40% 80%,#ff7a18,transparent),radial-gradient(3px 3px at 65% 95%,#ffd23f,transparent),radial-gradient(2px 2px at 85% 85%,#ff5f1f,transparent);background-size:180px 140px;animation:embers 4s linear infinite}
@keyframes embers{to{background-position:15px -140px,-10px -140px,20px -140px,-15px -140px}}
.shop{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}@media(max-width:860px){.shop{grid-template-columns:1fr}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.item{background:var(--panel);border-radius:6px;overflow:hidden;border:1px solid transparent;cursor:pointer}.item:hover{border-color:var(--line)}.item.try{border-color:var(--blue)}
.item .pv{position:relative;isolation:isolate;height:110px;display:flex;align-items:center;justify-content:center;background:#0f1923}.item .b{padding:10px 12px}.item .n{color:#fff;font-weight:600}.item .k{color:#8f98a0;font-size:12px}
.item .b button,.item .b .owned{width:100%;margin-top:8px}.owned{display:block;text-align:center;color:#a4d007;font-size:13px;padding:6px 0}
.mav{width:64px;height:64px;border-radius:50%;background:#2a3f55 center/cover;display:flex;align-items:center;justify-content:center;color:#fff;font:700 26px Georgia,serif}
.prof.themed{padding:14px;border-radius:8px}.prof.themed .box{background:rgba(10,14,22,.55)}
.uname{color:#8f98a0;font-size:15px;line-height:1.3}
.bdgs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px}
.bdg{position:relative;width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(0,0,0,.18)),var(--c);box-shadow:0 2px 6px #0007,inset 0 1px 0 rgba(255,255,255,.25);cursor:default;flex:none}
.bdg svg{width:17px;height:17px}
.bdg::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);background:#0b121b;color:#fff;padding:6px 10px;border-radius:6px;font:600 12px "Segoe UI",sans-serif;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;box-shadow:0 4px 14px #000b;z-index:40}
.bdg:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---- more avatar frames ---- */
.frame_pixel{border-radius:22%!important;box-shadow:0 0 0 3px #1d1d1d,0 0 0 6px #5fbf3a,0 0 0 9px #2f6b1f,0 0 0 12px #1d1d1d}
.frame_radar{box-shadow:0 0 0 3px #3dff9a,0 0 14px #3dff9a88}
.frame_radar::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid #3dff9a;animation:radar 1.8s ease-out infinite;pointer-events:none}
@keyframes radar{from{transform:scale(1);opacity:.9}to{transform:scale(1.45);opacity:0}}
.frame_chrome{box-shadow:0 0 12px #ffffff55}
.frame_chrome::before{content:"";position:absolute;inset:-6px;border-radius:50%;z-index:-1;background:conic-gradient(#fff,#8a8f98,#f4f6f8,#4b5058,#e8ebef,#9aa0a8,#fff);animation:spin 6s linear infinite}
.frame_glitch{animation:fglitch 1.6s steps(1) infinite}
@keyframes fglitch{0%{box-shadow:-3px 0 0 3px #ff2e63,3px 0 0 3px #08f7fe}20%{box-shadow:3px 1px 0 3px #ff2e63,-3px -1px 0 3px #08f7fe}40%{box-shadow:0 0 0 3px #fff}60%{box-shadow:-2px 2px 0 3px #ff2e63,2px -2px 0 3px #08f7fe}80%{box-shadow:4px 0 0 3px #ff2e63,-4px 0 0 3px #08f7fe}}
.frame_thorns{box-shadow:0 0 0 3px #5a0010,0 0 14px #8b0a1f99}
.frame_thorns::before{content:"";position:absolute;inset:-11px;border-radius:50%;z-index:-1;background:repeating-conic-gradient(#2a0008 0 5deg,#9b0f27 5deg 7deg,transparent 7deg 15deg);-webkit-mask:radial-gradient(circle,transparent 57%,#000 60%);mask:radial-gradient(circle,transparent 57%,#000 60%);animation:spin 24s linear infinite}
.frame_holo{box-shadow:0 0 18px #b7a6ff88}
.frame_holo::before{content:"";position:absolute;inset:-6px;border-radius:50%;z-index:-1;background:conic-gradient(#ff9ecf,#9ef0ff,#b7a6ff,#a6ffcb,#ffe29e,#ff9ecf);animation:spin 4s linear infinite,hue 3s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
/* ---- owner frames ---- */
.frame_sovereign{box-shadow:0 0 0 2px #fff3b0,0 0 26px 6px #ffcf4d99}
.frame_sovereign::before{content:"";position:absolute;inset:-9px;border-radius:50%;z-index:-1;background:conic-gradient(#fff3b0,#d4af37,#7a5b12,#ffe28a,#b8860b,#fff3b0);animation:spin 5s linear infinite;filter:drop-shadow(0 0 6px #ffcf4d)}
.frame_sovereign::after{content:"";position:absolute;inset:-17px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 3%,#fff 0 2px,#ffd27d 3px,transparent 6px),radial-gradient(circle at 50% 97%,#fff 0 1.5px,#ffd27d 2.5px,transparent 5px),radial-gradient(circle at 3% 50%,#fff 0 1.5px,transparent 4px),radial-gradient(circle at 97% 50%,#ffe28a 0 1.5px,transparent 4px);animation:spin 3s linear infinite reverse}
.frame_horizon{box-shadow:0 0 0 3px #000,0 0 36px 8px #7b2cff77}
.frame_horizon::before{content:"";position:absolute;inset:-12px;border-radius:50%;z-index:-1;background:conic-gradient(transparent 0 10%,#ff9d3c 18%,#fff3c4 24%,#ff9d3c 30%,transparent 42%,transparent 58%,#7b2cff 70%,#c9a8ff 76%,#7b2cff 82%,transparent 92%);filter:blur(2px);animation:spin 2.2s linear infinite}
.frame_horizon::after{content:"";position:absolute;inset:-22px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,transparent 55%,rgba(123,44,255,.3) 62%,transparent 72%);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.5}}
.frame_hellfire{box-shadow:0 0 0 3px #ff4500,0 0 30px 8px #ff2a0088;animation:hfire .9s ease-in-out infinite alternate}
@keyframes hfire{to{box-shadow:0 0 0 3px #ffae00,0 0 44px 12px #ff4500aa}}
.frame_hellfire::before{content:"";position:absolute;inset:-12px;border-radius:50%;z-index:-1;background:conic-gradient(#ff2a00,#ffae00,#ff4500,#ffd500,#ff2a00,#ff7b00,#ff2a00);filter:blur(4px);animation:spin 1.6s linear infinite}
.frame_hellfire::after{content:"";position:absolute;left:-14px;right:-14px;top:-30px;bottom:-6px;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse 30% 45% at 25% 30%,#ffae0099,transparent 70%),radial-gradient(ellipse 25% 50% at 70% 20%,#ff450099,transparent 70%),radial-gradient(ellipse 20% 40% at 50% 10%,#ffd50088,transparent 70%);filter:blur(3px);mix-blend-mode:screen;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{to{transform:translateY(-4px) scaleY(1.12);opacity:.75}}
/* ---- more themes ---- */
@keyframes drift{50%{background-position:100% 100%}}
.theme_ink{background:radial-gradient(ellipse at 20% 30%,#3a3f4a 0,transparent 50%),radial-gradient(ellipse at 80% 70%,#2a2d36 0,transparent 55%),radial-gradient(ellipse at 50% 50%,#1b1d24,#0b0c10)!important;background-size:200% 200%!important;animation:drift 18s ease-in-out infinite}
.theme_gold{background:linear-gradient(115deg,#0b0b0b 0,#0b0b0b 40%,#4a3809 50%,#0b0b0b 60%),linear-gradient(#0b0b0b,#14100a)!important;background-size:300% 100%,100% 100%!important;animation:sheen 6s linear infinite;box-shadow:inset 0 0 0 1px #d4af3755}
@keyframes sheen{from{background-position:100% 0,0 0}to{background-position:-200% 0,0 0}}
.theme_aurora{background:linear-gradient(180deg,rgba(5,10,30,.15),#050a1e 85%),linear-gradient(100deg,#0b3d2e,#1de9b6 25%,#3a1c71 50%,#00b4d8 75%,#0b3d2e)!important;background-size:100% 100%,300% 100%!important;animation:aur 12s ease-in-out infinite alternate}
@keyframes aur{to{background-position:0 0,100% 0}}
.theme_lava{background:radial-gradient(circle at 20% 80%,#ff4500 0,transparent 35%),radial-gradient(circle at 75% 25%,#ff8c00 0,transparent 30%),radial-gradient(circle at 60% 90%,#b30000 0,transparent 40%),#1a0500!important;background-size:160% 160%!important;animation:drift 10s ease-in-out infinite}

function burst(x,y,o={}){const ash=o.ash,cols=o.colors||(ash?["#555","#777","#999","#3a3a3a","#b3122e"]:["#ffd27d","#ff8fb1","#a98bff","#5ee6ff","#a4d007","#fff"]),n=o.n||(ash?45:70);
 for(let i=0;i<n;i++){const p=document.createElement("i"),s=ash?2+Math.random()*4:5+Math.random()*6;p.className="cfx";
  p.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${ash?s:s*.45}px;background:${cols[i%cols.length]};border-radius:${ash?"50%":"2px"}`;document.body.append(p);
  if(!p.animate){p.remove();continue}
  const a=ash?-Math.PI/2+(Math.random()-.5)*2.4:Math.random()*Math.PI*2,v=ash?50+Math.random()*120:120+Math.random()*260,dx=Math.cos(a)*v,dy=Math.sin(a)*v;
  p.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${dx}px,${dy+(ash?-70:240)}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:(ash?1300:1000)+Math.random()*800,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>p.remove()}}
function burstAt(el,o){const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/3,width:0,height:0};burst(r.left+r.width/2,r.top+r.height/2,o)}
function cooldown(b,sec){if(!b)return;b.disabled=true;b.classList.add("cool");b.style.setProperty("--cd",sec+"s");setTimeout(()=>{b.disabled=false;b.classList.remove("cool")},sec*1000)}
const holdHtml=(label,action)=>`<button class="hold danger" data-hold="${esc(action)}"><span class="hf"></span><span class="hl">${esc(label)}</span></button>`;
const slideHtml=(label,action,style="")=>`<div class="slide" style="${style}" data-slide="${esc(action)}"><div class="sf"></div><div class="st">${esc(label)}</div><div class="knob">➜</div></div>`;
const runAct=s=>{try{new Function(s)()}catch(e){toast(e.message)}};
(function(){let hb=null,t0=0,raf=0;const MS=1100;
 const stop=()=>{if(!hb)return;cancelAnimationFrame(raf);hb.classList.remove("holding");hb.style.setProperty("--p",0);hb=null};
 const tick=()=>{if(!hb)return;const p=Math.min(1,(performance.now()-t0)/MS);hb.style.setProperty("--p",p*100);
  if(p>=1){const b=hb,act=b.dataset.hold;stop();burstAt(b,{ash:true});runAct(act)}else raf=requestAnimationFrame(tick)};
 const start=b=>{if(hb||b.disabled)return;hb=b;t0=performance.now();b.classList.add("holding");raf=requestAnimationFrame(tick)};
 document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest(".hold");if(b){e.preventDefault();start(b)}});
 addEventListener("pointerup",stop);addEventListener("pointercancel",stop);document.addEventListener("pointerout",e=>{if(hb&&e.target.closest&&e.target.closest(".hold")===hb&&!hb.contains(e.relatedTarget))stop()});
 document.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat&&e.target.classList&&e.target.classList.contains("hold")){e.preventDefault();start(e.target)}});
 document.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")stop()});
 document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest(".hold")){e.preventDefault();if(e.detail===0)return;toast("Keep holding the button")}},true);
 // slide to confirm
 let sl=null,sx=0,max=0;
 document.addEventListener("pointerdown",e=>{const k=e.target.closest&&e.target.closest(".slide .knob");if(!k)return;e.preventDefault();sl=k.parentElement;sx=e.clientX;max=sl.clientWidth-k.offsetWidth-6;k.style.transition=sl.querySelector(".sf").style.transition="none"});
 addEventListener("pointermove",e=>{if(!sl)return;const x=Math.max(0,Math.min(max,e.clientX-sx));sl.querySelector(".knob").style.transform=`translateX(${x}px)`;sl.querySelector(".sf").style.width=(x+38)+"px";sl.querySelector(".st").style.opacity=1-x/max});
 addEventListener("pointerup",e=>{if(!sl)return;const s=sl,k=s.querySelector(".knob"),x=Math.max(0,Math.min(max,e.clientX-sx));sl=null;
  if(x>=max*.92){s.classList.add("boom");burstAt(s,{colors:["#ff4d2e","#ffae00","#ffd23f","#fff","#7a1f1f"],n:90});setTimeout(()=>runAct(s.dataset.slide),350)}
  else{k.style.transition="transform .3s cubic-bezier(.3,1.6,.5,1)";s.querySelector(".sf").style.transition="width .3s";k.style.transform="";s.querySelector(".sf").style.width="0";s.querySelector(".st").style.opacity=1}});
 // evil eyes follow the cursor
 addEventListener("mousemove",e=>{document.querySelectorAll(".eye").forEach(eye=>{const r=eye.getBoundingClientRect(),a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));eye.firstElementChild.style.transform=`translate(${Math.cos(a)*4}px,${Math.sin(a)*4}px)`})});
 // the troll button runs away
 let dodges=0;const LINES=["Nope.","Too slow.","Not today.","Try harder.","Almost!","Fine. Press me."];
 document.addEventListener("pointerover",e=>{const b=e.target.closest&&e.target.closest("#troll");if(!b||dodges>=5)return;dodges++;b.style.position="fixed";
  b.style.left=Math.round(20+Math.random()*(innerWidth-160))+"px";b.style.top=Math.round(80+Math.random()*(innerHeight-200))+"px";b.textContent=LINES[dodges-1]});
 document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("#troll");if(!b)return;burstAt(b,{n:120});toast("…nothing happened. Or did it?");b.style.position="";b.style.left=b.style.top="";b.textContent="Don't press";dodges=0});
})();

function socialBtns(p){const k=p.key,fs=p.friendState;
 return (p.isFollowing?`<button onclick="follow('${k}',false)">Following ✓</button>`:`<button class="buy" onclick="follow('${k}',true,this)">Follow</button>`)+
  (fs==="friends"?`<button onclick="friend('${k}','remove','Unfriend ${esc(p.display||p.name)}?')">Friends ✓</button>`:fs==="sent"?`<button onclick="friend('${k}','remove')">Cancel friend request</button>`
   :fs==="received"?`<button class="buy" onclick="friend('${k}','accept',null,this)">Accept friend request</button><button onclick="friend('${k}','decline')">Decline</button>`:(p.friendsLocked?`<button class="flock" onclick="lockedFriend(this,'${esc(p.display||p.name)}')" aria-label="Friend requests are locked for this account"><span class="fl-t">Add friend</span><span class="fl-i"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10.5" rx="2.5" fill="#fff"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="15.2" r="1.7" fill="#b3122e"/><rect x="11.2" y="15.6" width="1.6" height="3" rx=".8" fill="#b3122e"/></svg></span></button>`:`<button class="buy" onclick="friend('${k}','request',null,this)">Add friend</button>`))}
function lockedFriend(b,n){b.classList.remove("nope");void b.offsetWidth;b.classList.add("nope");toast(n+" isn't accepting friend requests")}
async function follow(k,on,el){try{await post(`/api/users/${k}/${on?"follow":"unfollow"}`);if(on&&el)burstAt(el,{n:40});toast(on?"Following":"Unfollowed");route()}catch(e){toast(e.message)}}
async function friend(k,act,ask,el){if(ask&&!confirm(ask))return;try{const j=await post(`/api/friends/${k}/${act}`);if(j.state==="friends"&&el)burstAt(el);
 toast({request:j.state==="friends"?"You're now friends!":"Friend request sent",accept:"You're now friends!",decline:"Request declined",remove:"Done"}[act]);route()}catch(e){toast(e.message)}}

 ${d.incoming.length?`<h2>Friend requests (${d.incoming.length})</h2>${d.incoming.map(s=>personCard(s,`<div class="acts" style="margin:0"><button class="buy" onclick="friend('${s.key}','accept',null,this)">Accept</button><button onclick="friend('${s.key}','decline')">Decline</button></div>`)).join("")}`:""}
 <h2>Friends (${d.friends.length}) <span style="color:#8f98a0;font-size:14px">${d.friends.filter(on).length} online</span></h2>${d.friends.map(s=>personCard(s,`<button onclick="friend('${s.key}','remove','Unfriend ${esc(s.display)}?')">Unfriend</button>`)).join("")||'<div class="empty">No friends yet. Send someone a request!</div>'}
 ${d.outgoing.length?`<h2>Sent requests (${d.outgoing.length})</h2>${d.outgoing.map(s=>personCard(s,`<button onclick="friend('${s.key}','remove')">Cancel</button>`)).join("")}`:""}`;
 const send=()=>{const u=$("#fadd").value.trim().replace(/^@/,"");if(u)friend(u,"request",null,$("#faddb"))};$("#faddb").onclick=send;$("#fadd").onkeydown=e=>{if(e.key==="Enter")send()}}
async function peoplePage(key,kind){if(!["followers","following","friends"].includes(kind))kind="followers";let p,list;
 try{[p,list]=await Promise.all([api("/api/profile/"+encodeURIComponent(key)),api(`/api/users/${encodeURIComponent(key)}/${kind}`)])}catch(e){return $("#app").innerHTML='<div class="empty">Profile not found.</div>'}

async function loadComments(id){const box=$("#cms");if(!box)return;const g=games.find(x=>x.id===id);let list=[];try{list=await api(`/api/games/${id}/comments`)}catch(e){}

  <div style="flex:1;min-width:0"><div class="cmh"><a class="cmn" onclick="go('profile/${a.key}')"><span class="${a.nameStyle}">${esc(a.display)}</span></a><span class="cmu">@${esc(a.name)}</span>${a.badges.slice(0,4).map(badgeHtml).join("")}${c.isDev?'<span class="pill ok">Developer</span>':c.owns?'<span class="pill">Owns this game</span>':""}<span class="cmu">${ago(c.at)}</span></div>
  <div class="cmx">${esc(c.text)}</div></div>${me&&(a.key===me.name.toLowerCase()||mod)?`<button class="cmd" onclick="delComment(${id},'${c.id}',${a.key!==me.name.toLowerCase()})">Delete</button>`:""}</div>`}).join("")||'<div class="empty">No comments yet. Be the first!</div>'}`;
 const t=$("#cmt");if(!t)return;t.oninput=()=>{$("#cmc").textContent=t.value.length+"/1000"};

async function delComment(gid,cid,other){if(!confirm(other?"Delete this comment as a moderator?":"Delete your comment?"))return;try{await api(`/api/games/${gid}/comments/${cid}`,{method:"DELETE"});toast("Comment deleted");loadComments(gid)}catch(e){toast(e.message)}}
// ---------- bans ----------
const fmtWhen=t=>new Date(t*1000).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
const BAN_REASONS=["Spam or scams","Harassment or hate","Cheating or exploits","Malware or harmful files","Impersonation","Inappropriate content","Repeated rule breaking"];
const BAN_LENGTHS=[["1 hour",1],["1 day",24],["3 days",72],["7 days",168],["30 days",720],["Permanent",0]];
function clearBan(){clearInterval(banT);document.body.classList.remove("isbanned");const w=$("#banwrap");if(w)w.remove()}
function banScreen(b){clearInterval(banT);document.body.classList.add("isbanned");let w=$("#banwrap");if(!w){w=document.createElement("div");w.id="banwrap";document.body.append(w)}
 const perm=!b.until,skew=b.now*1000-Date.now();
 w.innerHTML=`<div class="bancard" role="alertdialog" aria-labelledby="bant"><div class="banbar"></div>
 <div class="banicon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M12 2l8 3v6c0 5.2-3.4 9.4-8 11-4.6-1.6-8-5.8-8-11V5z"/><rect x="10.8" y="6.6" width="2.4" height="7.4" rx="1.2" fill="#b3122e"/><circle cx="12" cy="17" r="1.45" fill="#b3122e"/></svg></div>
 <div class="bankick">Vespera · Account status</div>
 <h1 id="bant">${perm?"Your account has been permanently banned":"Your account is suspended"}</h1>
 <p class="bansub"><b>@${esc(b.username)}</b> ${perm?"can no longer use Vespera.":"can't use Vespera until <b>"+fmtWhen(b.until)+"</b>."}</p>
 <div class="banreason"><span>Reason</span><b>${esc(b.reason||"Breaking Vespera's rules")}</b>${b.note?`<p>${esc(b.note)}</p>`:""}</div>
 ${perm?"":`<div class="bancount" aria-live="polite">${["Days","Hours","Minutes","Seconds"].map(l=>`<div class="cd"><b data-u="${l}">00</b><span>${l}</span></div>`).join("")}</div><div class="banprog"><i id="bpi"></i></div><div class="banleft" id="bleft"></div>`}
 <div class="bangrid"><div><span>Status</span><b>${perm?"Permanent ban":"Temporary suspension"}</b></div><div><span>Started</span><b>${b.at?fmtWhen(b.at):"—"}</b></div>
 <div><span>Ends</span><b>${perm?"Never":fmtWhen(b.until)}</b></div><div><span>Case ID</span><b class="mono">${esc(b.caseId)} <button class="cpy" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(b.caseId)}');toast('Case ID copied')" aria-label="Copy case ID">Copy</button></b></div></div>
 <div class="banacts"><button onclick="toggleAcc(event)">Switch account</button><button onclick="logout()">Log out</button><button class="buy" onclick="route()">Check again</button></div>
 <div class="banfoot">Think this is a mistake? Contact a Vespera admin and include your case ID.</div></div>`;
 if(perm)return;
 const tick=()=>{const now=Date.now()+skew,left=Math.max(0,b.until*1000-now),tot=Math.max(1,(b.until-b.at)*1000),d=Math.floor(left/864e5),hh=Math.floor(left/36e5)%24,mm=Math.floor(left/6e4)%60,ss=Math.floor(left/1e3)%60;
  [d,hh,mm,ss].forEach((v,i)=>{const e=w.querySelector(`[data-u="${["Days","Hours","Minutes","Seconds"][i]}"]`);if(e)e.textContent=String(v).padStart(2,"0")});
  const bp=$("#bpi");if(bp)bp.style.width=Math.min(100,(1-left/tot)*100)+"%";const bl=$("#bleft");if(bl)bl.textContent=Math.round((1-left/tot)*100)+"% of your suspension served";
  if(left<=0){clearInterval(banT);$("#bant").textContent="Your suspension has ended";bl.textContent="Welcome back. Loading Vespera…";setTimeout(route,1500)}};
 tick();banT=setInterval(tick,1000)}
let banSel={reason:BAN_REASONS[0],hours:24};
function openBan(key,name){banSel={reason:BAN_REASONS[0],hours:24};const m=document.createElement("div");m.className="modal";m.id="banmodal";m.onclick=e=>{if(e.target===m)m.remove()};
 m.innerHTML=`<div class="mcard"><h2 style="margin:0 0 4px;border:0">Ban @${esc(name)}</h2><p style="color:#8f98a0;margin:0 0 14px">They'll see the reason, when the ban ends and a case ID. Their games leave the store until the ban ends.</p>
 <label>Reason</label><div class="seg" id="brs">${BAN_REASONS.map(r=>`<button data-r="${esc(r)}">${esc(r)}</button>`).join("")}<button data-r="">Other…</button></div>
 <input id="bro" placeholder="Write the reason" maxlength="120" hidden style="margin-top:8px">
 <label>Message to them (optional)</label><textarea id="bnote" rows="2" maxlength="500" placeholder="What happened, in a sentence or two"></textarea>
 <label>Length</label><div class="seg" id="bls">${BAN_LENGTHS.map(([l,hr])=>`<button data-h="${hr}">${l}</button>`).join("")}</div>
 <div class="bsum" id="bsum"></div><div class="acts" style="justify-content:flex-end"><button onclick="$('#banmodal').remove()">Cancel</button>${holdHtml("Hold to ban",`confirmBan('${key}')`)}</div></div>`;
 document.body.append(m);
 const paint=()=>{m.querySelectorAll("#brs button").forEach(b=>b.classList.toggle("on",b.dataset.r===banSel.reason||(b.dataset.r===""&&banSel.other)));m.querySelectorAll("#bls button").forEach(b=>b.classList.toggle("on",+b.dataset.h===banSel.hours));
  $("#bro").hidden=!banSel.other;$("#bsum").innerHTML=banSel.hours?`Suspended until <b>${fmtWhen(Date.now()/1000+banSel.hours*3600)}</b>`:`<b style="color:#ff8a8a">Permanent ban.</b> Only an admin can lift it.`};
 m.querySelectorAll("#brs button").forEach(b=>b.onclick=()=>{banSel.other=b.dataset.r==="";if(!banSel.other)banSel.reason=b.dataset.r;paint();if(banSel.other)$("#bro").focus()});

async function confirmBan(key){const reason=banSel.other?$("#bro").value.trim():banSel.reason;if(!reason)return toast("Write the reason");
 try{await post("/api/admin/ban",{username:key,ban:true,reason,note:$("#bnote").value.trim(),hours:banSel.hours});$("#banmodal").remove();toast("User banned");route()}catch(e){toast(e.message)}}

function afterSwitch(){tryOn={};admTab="";shopSlot="all";go("");route()}
async function switchAcc(k){closeAcc();try{await post("/api/accounts/switch",{username:k});toast("Switched to @"+k);afterSwitch()}catch(e){toast(e.message)}}
async function removeAcc(k,n){if(!confirm(`Remove @${n} from the account switcher? You'll need its password to add it again.`))return;try{await post("/api/accounts/remove",{username:k});closeAcc();toast("Removed @"+n);route()}catch(e){toast(e.message)}}
const PRES={online:["Online","#57cbde"],away:["Away","#e0b44c"],busy:["Busy","#e05252"],offline:["Offline","#8f98a0"],invisible:["Invisible","#8f98a0"]};
const BC={Admin:"#c0392b",Moderator:"#2e86c1",Developer:"#27ae60",Collector:"#8e44ad",Founder:"#d4a017","Beta Tester":"#16a085","Verified Dev":"#2980b9",Supporter:"#d35498"};
const BADGES={
 Admin:{c:"#d64541",d:"Runs Vespera",p:'<path fill="#fff" d="M3 17.5h18l-1.6-9.5-4.4 3.8L12 5l-3 6.8-4.4-3.8z"/><rect fill="#fff" x="3" y="19" width="18" height="2.2" rx="1.1"/>'},
 Moderator:{c:"#2e86c1",d:"Reviews games",p:'<path fill="#fff" d="M12 2l8 3v6c0 5.2-3.4 9.4-8 11-4.6-1.6-8-5.8-8-11V5z"/><path fill="none" stroke="#2e86c1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M8.5 12l2.5 2.5 4.5-5"/>'},
 Developer:{c:"#27ae60",d:"Has a game in the store",p:'<path fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M8 7l-5 5 5 5M16 7l5 5-5 5"/>'},
 Collector:{c:"#8e44ad",d:"Owns 10 or more games",p:'<path fill="#fff" d="M6 3h12l4 6-10 12L2 9z"/><path fill="none" stroke="#8e44ad" stroke-width="1.4" d="M2 9h20M9 3 7 9l5 12 5-12-2-6"/>'},
 Founder:{c:"#d4a017",d:"Here from the start",p:'<path fill="#fff" d="M12 2l3 6.6 7.1.8-5.3 4.8 1.5 7L12 17.6l-6.3 3.6 1.5-7L1.9 9.4 9 8.6z"/>'},
 "Beta Tester":{c:"#16a085",d:"Helped test Vespera",p:'<path fill="#fff" d="M9 2h6v2h-1v5.2l5.4 9.3A2 2 0 0 1 17.7 21H6.3a2 2 0 0 1-1.7-2.5L10 9.2V4H9z"/><circle fill="#16a085" cx="10" cy="16.5" r="1.4"/><circle fill="#16a085" cx="14" cy="18.2" r="1"/>'},
 "Verified Dev":{c:"#2980b9",d:"Verified developer",p:'<path fill="#fff" d="M12 1.5l2.9 2.2 3.6-.3.9 3.5 3.1 1.9-1.4 3.2 1.4 3.3-3.1 1.9-.9 3.5-3.6-.3L12 22.5l-2.9-2.2-3.6.3-.9-3.5-3.1-1.9L2.9 12 1.5 8.8l3.1-1.9.9-3.5 3.6.3z"/><path fill="none" stroke="#2980b9" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" d="M7.8 12.2l2.8 2.8 5.6-5.8"/>'},
 Partner:{c:"#d4a017",d:"Official Vespera partner",p:'<path fill="#fff" d="M12 1.5l2.9 2.2 3.6-.3.9 3.5 3.1 1.9-1.4 3.2 1.4 3.3-3.1 1.9-.9 3.5-3.6-.3L12 22.5l-2.9-2.2-3.6.3-.9-3.5-3.1-1.9L2.9 12 1.5 8.8l3.1-1.9.9-3.5 3.6.3z"/><path fill="none" stroke="#b8860b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M7.8 12.2l2.8 2.8 5.6-5.8"/>'},
 Owner:{c:"#c99a1e",d:"Owner of Vespera",p:'<path fill="#fff" d="M2.5 17.8h19l-1.8-10-5 4.2L12 4.3 9.3 12 4.3 7.8z"/><rect fill="#fff" x="2.5" y="19.2" width="19" height="2.2" rx="1.1"/><path fill="#c99a1e" d="M12 11.6l.9 1.8 2 .3-1.4 1.4.3 2-1.8-.9-1.8.9.3-2-1.4-1.4 2-.3z"/>'},
 Supporter:{c:"#d35498",d:"Supports Vespera",p:'<path fill="#fff" d="M12 21s-8.5-5.4-8.5-11.2A4.7 4.7 0 0 1 12 7a4.7 4.7 0 0 1 8.5 2.8C20.5 15.6 12 21 12 21z"/>'}};
const badgeHtml=b=>{const x=BADGES[b]||{c:"#556",d:"",p:'<circle fill="#fff" cx="12" cy="12" r="6"/>'};return `<span class="bdg${b==="Owner"?" owner":b==="Partner"?" partner":""}" style="--c:${x.c}" data-tip="${esc(b)}${x.d?" · "+esc(x.d):""}" role="img" aria-label="${esc(b)}"><svg viewBox="0 0 24 24" aria-hidden="true">${x.p}</svg></span>`};
async function profilePage(name){let p;try{p=await api("/api/profile/"+encodeURIComponent(name))}catch(e){return $("#app").innerHTML='<div class="empty">Profile not found.</div>'}
 const mine=me&&me.name.toLowerCase()===p.key,t=Date.now(),pr=PRES[p.presence]||PRES.online;
 const eq=p.equipped||{};$("#app").innerHTML=`<div class="prof ${eq.theme?"themed "+eq.theme:""}"><div class="box" style="padding:0;overflow:hidden"><div class="fxb ${eq.effect||""}" style="height:200px;background:${p.hasBanner?`url(/banner/${p.key}?t=${t}) center/cover`:"linear-gradient(135deg,#2b5876,#4e4376)"}"></div>
 <div style="display:flex;gap:18px;padding:0 20px 20px;margin-top:-46px;flex-wrap:wrap;align-items:flex-start;position:relative;z-index:2"><div class="fx ${eq.frame||""}" style="width:128px;height:128px;border-radius:50%;border:4px solid var(--panel);background:#0f1923 ${p.hasAvatar?`url(/avatar/${p.key}?t=${t}) center/cover`:""};display:flex;align-items:center;justify-content:center;font:700 52px Georgia,serif;color:#fff">${p.hasAvatar?"":esc(p.name[0].toUpperCase())}</div>
 <div style="flex:1;min-width:200px;padding-top:56px"><h1 style="margin:0"><span class="${eq.name||""}">${esc(p.display||p.name)}</span></h1><div class="uname">@${esc(p.name)}</div>${p.badges.length?`<div class="bdgs">${p.badges.map(badgeHtml).join("")}</div>`:""}<div style="color:${pr[1]}">● ${pr[0]}${p.statusText?` <span style="color:var(--text)">· ${esc(p.statusText)}</span>`:""}</div>
 <div class="soc"><a onclick="go('people/${p.key}/followers')"><b>${p.followers}</b> follower${p.followers===1?"":"s"}</a><a onclick="go('people/${p.key}/following')"><b>${p.followingCount}</b> following</a><a onclick="go('people/${p.key}/friends')"><b>${p.friendsCount}</b> friend${p.friendsCount===1?"":"s"}</a></div></div>
 <div class="pacts">${mine?`<button onclick="go('settings')">Edit profile</button><button onclick="go('friends')">My friends</button>`:me?socialBtns(p):`<button class="buy" onclick="go('login')">Log in to follow</button>`}</div></div></div>
 <div class="game" style="margin-top:16px"><div><div class="box"><b style="color:#fff">About</b><p style="white-space:pre-wrap;margin:8px 0 0">${esc(p.bio)||"This user hasn't written a bio yet."}</p></div>${p.games.length?`<h2>Games by ${esc(p.name)}</h2><div class="grid">${p.games.map(card).join("")}</div>`:""}</div>
 <div class="box"><b style="color:#fff">Member info</b><div style="color:#8f98a0;margin-top:6px;line-height:1.8">${p.joined?"Member since "+new Date(p.joined*1000).toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})+"<br>":""}Games owned: ${p.owned}${p.games.length?"<br>Games published: "+p.games.length:""}</div>${mine?`<button style="width:100%;margin-top:12px" onclick="go('shop')">Decorate in the Profile Shop</button>`:""}</div></div></div>`}
async function settingsPage(){if(!me)return go("login");const p=await api("/api/profile/"+encodeURIComponent(me.name)),t=Date.now(),IMG="image/png,image/jpeg,image/webp",raw={online:"Online",away:"Away",busy:"Busy",invisible:"Invisible"},
 S={av:null,bn:null,rav:false,rbn:false,avUrl:p.hasAvatar?`/avatar/${p.key}?t=${t}`:"",bnUrl:p.hasBanner?`/banner/${p.key}?t=${t}`:""};
 $("#app").innerHTML=`<h1>My profile</h1><div class="pe"><div>
 <h2 style="margin-top:0">Display name</h2><input id="dn" maxlength="32" value="${esc(p.display===p.name?"":p.display)}" placeholder="${esc(p.name)}">
 <div style="color:#8f98a0;font-size:13px;margin-top:6px">Your username is <b style="color:#fff">@${esc(p.name)}</b>. Only admins can change usernames.</div>
 <h2>Avatar</h2><button class="buy" id="avb">Change avatar</button> <button id="avr">Remove avatar</button>
 <h2>Banner</h2><button class="buy" id="bnb">Change banner</button> <button id="bnr">Remove banner</button>
 <h2>Status</h2><select id="pr">${Object.entries(raw).map(([k,v])=>`<option value="${k}" ${k===p.presence?"selected":""}>${v}</option>`).join("")}</select>
 <input id="st" maxlength="80" value="${esc(p.statusText)}" placeholder="What are you up to?" style="margin-top:8px">
 <h2>About me</h2><textarea id="bio" rows="5" maxlength="500" placeholder="Tell people about yourself">${esc(p.bio)}</textarea><div id="cnt" style="color:#8f98a0;font-size:12px;text-align:right"></div>
 <h2>Badges to show</h2>${p.earned.length?p.earned.map(b=>`<label style="display:inline-flex;gap:8px;align-items:center;margin:0 16px 8px 0;color:#fff"><input type="checkbox" class="bd" value="${esc(b)}" style="width:auto" ${p.shown.includes(b)?"checked":""}> ${badgeHtml(b)} ${esc(b)}</label>`).join(""):'<div style="color:#8f98a0">No badges yet. Publish an approved game or own 10 games.</div>'}
 <input type="file" id="avin" accept="${IMG}" hidden><input type="file" id="bnin" accept="${IMG}" hidden></div>
 <div><div class="pcard ${(p.equipped||{}).theme||""}"><div id="pbn" class="pbn fxb ${(p.equipped||{}).effect||""}" title="Change banner"></div><div class="pbody"><div id="pav" class="pav fx ${(p.equipped||{}).frame||""}" title="Change avatar"><span id="pin"></span><i id="pdot"></i></div>
 <div class="pname"><span id="pdn" class="${(p.equipped||{}).name||""}"></span></div><div class="uname">@${esc(p.name)}</div><div id="pbd" class="bdgs"></div><div id="pst" class="pstat"></div><hr><b style="font-size:13px;color:#fff">About me</b><div id="pbio" class="pbio"></div></div></div></div></div>
 <div id="savebar" hidden><span>You have unsaved changes.</span><button id="rs">Reset</button><button class="buy" id="sv">Save changes</button><span id="msg" style="color:#ff8a8a"></span></div>`;
 const bar=$("#savebar"),msg=m=>{$("#msg").textContent=m;bar.hidden=false};
 const pv=()=>{$("#pbn").style.background=S.bnUrl?`url(${S.bnUrl}) center/cover`:"linear-gradient(135deg,#2b5876,#4e4376)";$("#pav").style.backgroundImage=S.avUrl?`url(${S.avUrl})`:"none";$("#pin").textContent=S.avUrl?"":p.name[0].toUpperCase();
  $("#pdot").style.background=(PRES[$("#pr").value]||PRES.online)[1];$("#pdn").textContent=$("#dn").value.trim()||p.name;$("#pst").textContent=$("#st").value;$("#pbio").textContent=$("#bio").value||"Nothing here yet.";$("#cnt").textContent=$("#bio").value.length+"/500";
  $("#pbd").innerHTML=[...document.querySelectorAll(".bd:checked")].map(x=>badgeHtml(x.value)).join("")};
 const dirty=()=>{bar.hidden=false;$("#msg").textContent="";pv()};
 const pick=(inp,key,rk,uk,lim,name)=>{$(inp).onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>lim*1048576)return msg(name+" must be under "+lim+" MB");S[key]=f;S[rk]=false;S[uk]=URL.createObjectURL(f);dirty()}};
 pick("#avin","av","rav","avUrl",2,"Avatar");pick("#bnin","bn","rbn","bnUrl",5,"Banner");
 $("#avb").onclick=$("#pav").onclick=()=>$("#avin").click();$("#bnb").onclick=$("#pbn").onclick=()=>$("#bnin").click();
 $("#avr").onclick=()=>{S.av=null;S.rav=true;S.avUrl="";dirty()};$("#bnr").onclick=()=>{S.bn=null;S.rbn=true;S.bnUrl="";dirty()};
 ["#dn","#pr","#st","#bio"].forEach(s=>$(s).oninput=dirty);document.querySelectorAll(".bd").forEach(c=>c.onchange=dirty);
 $("#rs").onclick=()=>settingsPage();pv();
 $("#sv").onclick=async()=>{const fd=new FormData();fd.append("display",$("#dn").value);fd.append("presence",$("#pr").value);fd.append("statusText",$("#st").value);fd.append("bio",$("#bio").value);fd.append("shown",[...document.querySelectorAll(".bd:checked")].map(x=>x.value).join("|"));
  fd.append("removeAvatar",S.rav?"1":"0");fd.append("removeBanner",S.rbn?"1":"0");if(S.av)fd.append("avatar",S.av);if(S.bn)fd.append("banner",S.bn);
  $("#sv").disabled=true;try{await api("/api/profile",{method:"POST",body:fd});toast("Profile saved");go("profile/"+me.name)}catch(e){msg(e.message)}$("#sv").disabled=false}}
async function renameUser(key,old){const nn=prompt(`New username for @${old} (3-24 letters, numbers or _).\nThey'll log in with the new username from now on.`,old);if(nn===null||nn===old)return;
 try{await post("/api/admin/username",{username:key,newName:nn.trim()});toast("@"+old+" is now @"+nn.trim());route()}catch(e){toast(e.message)}}
async function friendLock(k,lock){try{await post("/api/admin/friendlock",{username:k,locked:lock});toast(lock?"Friend requests locked":"Friend requests unlocked");route()}catch(e){toast(e.message)}}
async function setRole(n,r){try{await post("/api/admin/role",{username:n,role:r});route()}catch(e){toast(e.message)}}
addEventListener("hashchange",route);route();
</script></body></html>

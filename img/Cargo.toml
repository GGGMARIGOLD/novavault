[package]
name = "vespera-img"
version = "0.1.0"
edition = "2021"
description = "Shrinks images uploaded to Vespera (avatars, banners, game covers) so pages load faster."

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
